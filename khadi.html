<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaana.com</title>
</head>
<link rel="stylesheet" href="player.css">
<script src="music.js"></script>

<body>
  <div class="song-page">
    <header class="header">
      <h1>Bas Bajna Chahiye Gaana...</h1>
    </header>

    <main class="main-content">
      <div class="song-details">
        <div class="album-art">
          <img src="Clone of Gaana Photo & Music/khadi.jpg" alt="Album Art">
        </div>
        <div class="song-info">
          <h1 class="song-title">Khadi Jatt Naal</h1>
          <br>
          <p class="artist">Kiran Bajwa</p>
        </div>
      </div>

      <div class="song-controls">
        <button class="prev-song">&#9664;</button>
        <button class="play-pause">&#9658;</button>
        <button class="next-song">&#9654;</button>
      </div>
      <audio id="audioPlayer" src="Clone of Gaana Photo & Music/khadi.mp3"></audio>
      <div class="lyrics">
        <h2>Lyrics</h2>
        <p>Lyrics not available...</p>
      </div>

      <div class="related-songs">
        <h2>Related Songs</h2>
        <p>Related songs not available...</p>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2024 Gaana. All rights reserved.</p>
    </footer>
  </div>
</body>

</html>
